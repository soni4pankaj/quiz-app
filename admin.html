<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Question Manager (Admin)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1, h2 { color: #333; margin-top: 0; }
    .q-card { background: #f8f9fa; border: 1fr solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; position: relative; }
    input[type="text"] { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    .option-item { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #e0e0e0; }
    .btn { padding: 10px 18px; font-size: 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; margin-right: 8px; }
    .btn-save { background: #28a745; color: white; }
    .btn-add { background: #007bff; color: white; }
    .btn-delete { background: #dc3545; color: white; float: right; padding: 6px 12px; font-size: 13px; }
    .radio-label { font-size: 14px; font-weight: bold; color: #555; }
    #notification { padding: 12px; border-radius: 6px; margin-bottom: 15px; display: none; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Quiz Admin Panel</h1>
    <p>Add, edit, or remove questions for your live quiz.</p>

    <div id="notification"></div>

    <div id="questions-list"></div>

    <button class="btn btn-add" onclick="addNewQuestion()">+ Add New Question</button>
    <button class="btn btn-save" onclick="saveAllQuestions()">Save All Changes</button>
  </div>

  <script>
    let questions = [];

    // Fetch questions on load
    async function loadQuestions() {
      try {
        const res = await fetch('/api/questions');
        const data = await res.json();
        if (data.success) {
          questions = data.questions;
          renderQuestions();
        }
      } catch (err) {
        showNotification('Error loading questions', 'error');
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questions-list');
      container.innerHTML = '';

      questions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.innerHTML = `
          <button class="btn btn-delete" onclick="deleteQuestion(${qIndex})">Delete Question</button>
          <h3>Question ${qIndex + 1}</h3>
          
          <label><strong>Question Text:</strong></label>
          <input type="text" value="${escapeHtml(q.question)}" onchange="updateQuestionText(${qIndex}, this.value)" />

          <label><strong>Options & Correct Answer Choice:</strong></label>
          <div class="options-grid">
            ${q.options.map((opt, optIndex) => `
              <div class="option-item">
                <label class="radio-label">
                  <input type="radio" name="correct-${qIndex}" value="${optIndex}" ${q.answer === optIndex ? 'checked' : ''} onchange="updateCorrectAnswer(${qIndex}, ${optIndex})" />
                  Correct Option ${optIndex + 1}
                </label>
                <input type="text" value="${escapeHtml(opt)}" onchange="updateOptionText(${qIndex}, ${optIndex}, this.value)" />
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateQuestionText(qIndex, value) { questions[qIndex].question = value; }
    function updateOptionText(qIndex, optIndex, value) { questions[qIndex].options[optIndex] = value; }
    function updateCorrectAnswer(qIndex, optIndex) { questions[qIndex].answer = optIndex; }

    function addNewQuestion() {
      questions.push({
        id: Date.now(),
        question: "New Sample Question?",
        options: ["Option A", "Option B", "Option C", "Option D"],
        answer: 0
      });
      renderQuestions();
    }

    function deleteQuestion(qIndex) {
      if (confirm('Are you sure you want to delete this question?')) {
        questions.splice(qIndex, 1);
        renderQuestions();
      }
    }

    async function saveAllQuestions() {
      try {
        const res = await fetch('/api/questions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(questions)
        });
        const data = await res.json();
        if (data.success) {
          showNotification('Questions saved successfully to questions.json!', 'success');
        } else {
          showNotification('Failed to save questions.', 'error');
        }
      } catch (err) {
        showNotification('Server communication error.', 'error');
      }
    }

    function showNotification(msg, type) {
      const el = document.getElementById('notification');
      el.innerText = msg;
      el.className = type;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function escapeHtml(str) {
      return String(str).replace(/"/g, '&quot;');
    }

    // Initialize page
    loadQuestions();
  </script>
</body>
</html>
